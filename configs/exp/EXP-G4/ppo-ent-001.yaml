exp_id: EXP-G4
run_name: ppo-ent-001
owner: joaquin
rq: [RQ2]
seeds: [0, 1, 2, 3, 4]

env:
  id: WafArena/Attacker-v0
  backend: fast
  defender: {type: checkpoint, path: DEF-REF-1}   # the DQN reference, F3-T05 (ADR-0010)
  query_budget: 50

# Shared by EXP-G1..G3: same network, discount, entropy bonus and step budget (200 000, as the
# Phase 2 tabular attackers); each method keeps its usual CleanRL update schedule.
agent:
  algo: pg
  params:
    method: ppo
    hidden: [64, 64]
    gamma: 0.99
    ent_coef: 0.01   # EXP-G4 sweep: {0, 0.01, 0.05}
    vf_coef: 0.5
    max_grad_norm: 0.5
    eval_policy: sample
    threads: 1
    lr: 0.0003
    n_steps: 1024
    update_epochs: 4
    minibatch_size: 256
    clip_coef: 0.2
    gae_lambda: 0.95
    normalize_advantages: true
train:
  total_steps: 200000

eval:
  suites: [attacker-eval-v1]
  every_steps: 20000
  final: true

logging:
  tensorboard: false
