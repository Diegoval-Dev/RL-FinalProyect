[project]
name = "wafarena"
version = "0.1.0"
description = "WAF Arena: SQL injection attacker vs WAF defender with reinforcement learning"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy",
    "gymnasium",
]

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wafarena"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["lab: requires the Docker laboratory (make lab-up)"]
addopts = "-m 'not lab'"
