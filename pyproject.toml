[project]
name = "wafarena"
version = "0.1.0"
description = "WAF Arena: SQL injection attacker vs WAF defender with reinforcement learning"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy",
    "gymnasium",
    "fastapi>=0.146.0",
    "uvicorn>=0.54.0",
    "psycopg[binary]>=3.3.6",
    "python-multipart>=0.0.32",
    "pglast>=8.7",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "tensorboardx>=2.6.5",
    "torch>=2.4",
]

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "ruff",
]
report = [
    "matplotlib>=3.9",
]

# CPU-only PyTorch wheels (ADR-0009): the default PyPI wheel bundles CUDA, ~10x larger, and every
# lab image shares this dependency list.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wafarena", "lab/vulnapp/vulnapp"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["wafarena", "vulnapp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["lab/vulnapp", "lab/proxy", "lab/honeypot"]
markers = ["lab: requires the Docker laboratory (make lab-up)"]
addopts = "-m 'not lab'"
