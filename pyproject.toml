[project]
name = "wafarena"
version = "0.1.0"
description = "WAF Arena: SQL injection attacker vs WAF defender with reinforcement learning"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy",
    "gymnasium",
    "fastapi>=0.146.0",
    "uvicorn>=0.54.0",
    "psycopg[binary]>=3.3.6",
    "python-multipart>=0.0.32",
    "pglast>=8.7",
]

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "ruff",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wafarena", "lab/vulnapp/vulnapp"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["wafarena", "vulnapp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["lab/vulnapp"]
markers = ["lab: requires the Docker laboratory (make lab-up)"]
addopts = "-m 'not lab'"
