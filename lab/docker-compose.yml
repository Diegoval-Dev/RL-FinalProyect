name: wafarena-lab

networks:
  lab:
    internal: true

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: wafarena
      POSTGRES_USER: wafarena
      POSTGRES_PASSWORD: lab-only-password
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wafarena -d wafarena"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [lab]

  vulnapp:
    build:
      context: ..
      dockerfile: lab/Dockerfile
      target: vulnapp
    environment:
      DATABASE_URL: postgresql://wafarena:lab-only-password@db:5432/wafarena
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [lab]

  runner:
    build:
      context: ..
      dockerfile: lab/Dockerfile
      target: runner
    profiles: [tools]
    environment:
      DATABASE_URL: postgresql://wafarena:lab-only-password@db:5432/wafarena
      VULNAPP_URL: http://vulnapp:8000
    volumes:
      - ..:/workspace
    depends_on:
      vulnapp:
        condition: service_healthy
    networks: [lab]
